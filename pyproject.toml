[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decp-lecture"
version = "0.1.0"
description = "Lire les données essentielles de la commande publique (DECP) consolidées sans se tromper : grain, montants, groupements, personnes physiques, en DuckDB."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Victor Lavolé" }]
keywords = ["DECP", "marchés publics", "commande publique", "open data", "data.gouv.fr", "DuckDB"]
classifiers = [
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: SQL",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["duckdb>=1.1"]

[project.urls]
Source = "https://github.com/V08-ai/decp-lecture"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/decp_lecture"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
